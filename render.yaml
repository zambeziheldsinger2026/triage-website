services:
  - type: web
    runtime: static
    name: triage-web-studios
    staticPublishPath: .
    buildCommand: ""
    domains:
      - triagewebstudios.co.za
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=604800
